services:
    db:
        image: mariadb:10.6.0
        volumes:
            - ./_volumes/db/data:/var/lib/mysql
        restart: "no"
        environment:
           MYSQL_ROOT_PASSWORD: powerfull
           MYSQL_DATABASE: wordpress
           MYSQL_USER: wordpress
           MYSQL_PASSWORD: wordpress

    wordpress:
        depends_on:
            - db
        image: wordpress:latest
        ports:
            - "${SERVER_PORT}:80"  # Porta configurata in .env
            - "${VITE_PORT}:${VITE_PORT}"
        restart: "no"
        environment:
           WORDPRESS_DB_HOST: db:3306
           WORDPRESS_DB_USER: wordpress
           WORDPRESS_DB_PASSWORD: wordpress
           WORDPRESS_DB_NAME: wordpress
        volumes:
            - .:/var/www/html/wp-content/themes/${THEME_NAME}:delegated
            - ./_volumes/plugins:/var/www/html/wp-content/plugins
            - ./_volumes/uploads:/var/www/html/wp-content/uploads

volumes:
    db_data: {}
